name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name "Fleet CI"
      - run: git config --global user.email "fleet-ci@example.invalid"
      - run: npm run test:windows
      - run: node --test tests/api-capability.test.mjs tests/daemon-lock.test.mjs tests/daemon-startup.test.mjs tests/store-transactions.test.mjs
      - run: node --test tests/auth.test.mjs tests/windows-branding.test.mjs tests/desktop.test.mjs
      - run: node --test --test-timeout=90000 tests/brain-index.test.mjs tests/brain-writer.test.mjs tests/brain-wiki.test.mjs tests/brain-retrieval.test.mjs tests/workspace-files.test.mjs tests/worker-lifecycle.test.mjs tests/terminal-lifecycle.test.mjs tests/focused.test.mjs tests/teams.test.mjs tests/shutdown.test.mjs tests/workspace.test.mjs
      - run: npm run test:ui
      - run: npm run demo:verify
      - run: npm run build
      - run: node tests/live-brain.mjs --run
      - run: node tests/live-brain.mjs --run --large
      - run: node tests/live-native-browser.mjs --run --ui --shared --auto-open --full-app
      - run: npm run desktop:package:win
      - run: node scripts/verify-windows-package.mjs
      - run: node scripts/verify-windows-branding.mjs release/Fleet-0.2.0-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Fleet-Windows-x64
          path: release/*-Windows-x64-Setup.exe
          if-no-files-found: error
